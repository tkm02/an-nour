name: Frontend CI/CD

on:
  push:
    branches: [main, master, mDev]
  pull_request:
    branches: [main, master, mDev]

# Moindre privilège pour le jeton GitHub ; une PR relancée annule l'exécution précédente (jamais main)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies (lockfile strict)
        run: npm ci

      # Bloquant : un test en échec arrête le job, donc le déploiement (needs: build-and-test)
      - name: 🧪 Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: 🏗️ Build production
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_CLOUDINARY_CLOUD_NAME: ${{ secrets.REACT_APP_CLOUDINARY_CLOUD_NAME }}
          REACT_APP_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.REACT_APP_CLOUDINARY_UPLOAD_PRESET }}
          REACT_APP_CLOUDINARY_API_KEY: ${{ secrets.REACT_APP_API_KEY }}

      - name: 🛡️ Dependency audit (report only)
        continue-on-error: true
        run: npm audit --omit=dev

  # Secrets : bloquant sur ce que le push / la PR ajoute, rapport sur l'historique complet
  security:
    name: 🔐 Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Empreinte SHA-256 épinglée dans le workflow (GITLEAKS_SHA256) : une archive remplacée dans la release est refusée
      - name: 🔐 Install gitleaks (SHA-256 pinned)
        run: |
          V="${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: 🔐 Secrets introduced by this push / PR (blocking)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${SHA}"
          else
            echo "::warning::Commit précédent introuvable (nouvelle branche ou push forcé) : scan limité au dernier commit."
            RANGE="${SHA}~1..${SHA}"
          fi
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${RANGE}" .

      - name: 🔐 Full history scan (report only)
        continue-on-error: true
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .

  # Production : environnement GitHub « production » (activer « Required reviewers » pour exiger une approbation)
  deploy:
    name: 🚀 Deploy to Vercel
    needs: [build-and-test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🚀 Deploy to Vercel
        # Action tierce épinglée sur le commit du tag v25 (un tag peut être déplacé)
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
